[project]
name = "specprobe"
version = "0.1.0"
description = "A developer tool for probing, chunking, and testing API specifications."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Matt Walczyk", email = "mwalczyk81@hotmail.com" }
]
dependencies = [
    "click>=8.1.0",
    "prance[osv]>=26.7.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
specprobe = "specprobe.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "specprobe"
version = "0.1.0"
description = "A developer tool for probing, chunking, and testing API specifications."
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Matt Walczyk", email = "mwalczyk81@hotmail.com" }
]
dependencies = [
    "click>=8.1.0",
    "prance[osv]>=26.7.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
    "litellm>=1.0.0",
    "rich>=15.0.0",
]

[project.scripts]
specprobe = "specprobe.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*Cannot enable progress bars.*:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

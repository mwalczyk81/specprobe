openapi: "3.0.3"
info:
  title: "Petstore Probe API"
  version: "1.2.0"
  description: "Standard OpenAPI 3.0 fixture for SpecProbe testing."
security:
  - apiKeyAuth: []
paths:
  /pets:
    get:
      summary: "List all pets"
      operationId: "listPets"
      tags:
        - "pets"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
      responses:
        "200":
          description: "A paged array of pets"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Pet"
        "500":
          description: "Unexpected error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Create a pet"
      operationId: "createPets"
      tags:
        - "pets"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: "Null response"
        "default":
          description: "unexpected error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    parameters:
      - name: "petId"
        in: "path"
        required: true
        schema:
          type: "string"
    get:
      summary: "Info for a specific pet"
      operationId: "showPetById"
      tags:
        - "pets"
      security: []
      responses:
        "200":
          description: "Expected response to a valid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      summary: "Delete a pet"
      # operationId intentionally omitted to test synthesis
      tags:
        - "pets"
        - "admin"
      deprecated: true
      responses:
        "204":
          description: "Pet deleted successfully"
components:
  securitySchemes:
    apiKeyAuth:
      type: "apiKey"
      in: "header"
      name: "X-API-Key"
  schemas:
    Pet:
      type: "object"
      required:
        - "id"
        - "name"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        tag:
          type: "string"
    NewPet:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
        tag:
          type: "string"
    Error:
      type: "object"
      required:
        - "code"
        - "message"
      properties:
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
    UnusedSchema:
      type: "object"
      properties:
        extra:
          type: "string"
